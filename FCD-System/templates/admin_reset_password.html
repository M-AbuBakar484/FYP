<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Reset Password</title>


    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style4.css') }}">
</head>
<body>


    <div class="wrapper" style="margin-top: 5%;">
    <img src="/static/img/logo.png" alt="logo" style="width: 50%; margin-left: 23%; margin-bottom: -10px; margin-top: -10px;">
    <h3 style="text-align: center; margin-bottom: -20px; ">Reset Password</h3>
        <form method="POST" action="/admin_reset_password">
            <div class="input-box">
                <input type="password" placeholder="Enter your old password" name="old_password" required>
            </div>

            <div>
                <div class="input-box">
                    <input type="password" placeholder="Enter your new password" name="new_password" required>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Confirm your new password" name="confirm_new_password" required>
                </div>
            </div>

            <div class="input-box button">
                <input type="Submit" value="Confirm">
            </div>
              <div class="text">
                <a href="/admin_panel" style="color: blue;">Go Back to Admin Panel</a>
              </div>

            {% if error %}
                <center><strong style="color:red;"> {{ error }} </strong></center>
            {% endif %}
        </form>
    </div>
</body>
</html>
