



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forget Password</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style3.css') }}">
</head>
<body>
    <div class="wrapper">
    <img src="/static/img/logo.png" alt="logo" style="width: 50%; margin-left: 23%; margin-bottom: -10px; margin-top: -10px;">
    <h3 style="text-align: center; margin-bottom: -20px; ">Forget Password</h3>
        <form method="POST" action="/forget_password">
            <div class="input-box">
                <input type="text" placeholder="Enter your Username" name="uname" required>
            </div>
            <div class="input-box button">
                <input type="Submit" value="Done">
            </div>
            <a href="/">Go to Login</a>
        </form>


      {% if error %}
      <center><strong style="color:red"> {{ error }} </strong></center>
      {% endif %}

    </div>
</body>
</html>
