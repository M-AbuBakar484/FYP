<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Admin Registration Page </title>
      <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
   </head>
<body>
  <div class="wrapper">
    <img src="/static/img/logo.png" alt="logo" style="width: 50%; margin-left: 23%; margin-bottom: -10px; margin-top: -10px;">
    <h3 style="text-align: center; margin-bottom: -20px; ">Admin Registration</h3>
    <form method="post" action="/admin_add_user">
      <div class="input-box">
        <input type="text" placeholder="Enter Username" name="uname" required>
      </div>
      <div class="input-box">
        <input type="text" placeholder="Enter Email" name="uemail" required>
      </div>
      <div class="input-box">
        <input type="password" id="password" placeholder="Enter Password" name="upassword" required>

      </div>

      <div class="input-box button">
        <input type="Submit" value="Register Now">
      </div>

      <div class="text">
        <a href="/admin_panel">Go Back to Admin Panel</a>
      </div>


      {% if error %}
      <center><strong style="color:red"> {{ error }} </strong></center>
      {% endif %}

    </form>
  </div>
</body>

</html>
