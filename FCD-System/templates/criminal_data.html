<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criminal Records</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/criminal_data.css') }}">

    <!-- Unicons CSS -->
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.0/css/line.css" />

    <style>
        /* Add your CSS styles here */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }

        th {
            background-color: #f2f2f2;
        }


    </style>

</head>
<body>


    <!-- navbar starts -->

    <nav class="nav">
        <a href="/home" class="logo"><h1>FCD System</h1></a>
        <ul class="nav-links">
          <li><a href="/home">Home</a></li>
          <li><a href="/criminal_data">Criminals</a></li>
            <li>
                <div class="dropdown">
                    <a class="dropbtn">Account +</a>
                    <div class="dropdown-content">
                        <a href="/change_email">Change Email</a>
                        <a href="/reset_password">Change Password</a>
                    </div>
                </div>
            </li>
        </ul>
          <a href="/logout" class="btn-log" style="margin-right: -140px; margin-left: 60px;">Logout</a>
      </nav>

    <!-- navbar ends -->


    <div class="wrapper">

            <form method="post" action="/criminal_data">
                <div class="search-box">
                    <i class="uil uil-search"></i>
                    <input type="text" id="searchUser" name="searchUser" placeholder="Search here..." />
                    <button class="button" type="submit" name="form_action" value="search">Search</button>
                </div>
            </form>

            <form method="post" action="/criminal_data">
                <input type="hidden" name="resetTable" value="true">
                <button class="btn" type="submit" name="form_action" value="reset">Show Criminals</button>
            </form>

        <table id="userTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Age</th>
                    <th>Criminal Charges</th>
                    <th>Img-1</th>
                    <th>Img-2</th>
                    <th>Img-3</th>
                </tr>
            </thead>
            <tbody>
                {% for record in users %}
                <tr>
                    <td>{{ record[0] }}</td>
                    <td>{{ record[1] }}</td>
                    <td>{{ record[2] }}</td>
                    <td>{{ record[3] }}</td>
                    <td>{{ record[4] }}</td>
                    <td><img src="../static/images/{{ record[0] }}/1.jpg" alt="Criminal Image" style="width: 100px"></td>
                    <td><img src="../static/images/{{ record[0] }}/2.jpg" alt="Criminal Image" style="width: 100px"></td>
                    <td><img src="../static/images/{{ record[0] }}/3.jpg" alt="Criminal Image" style="width: 100px"></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
